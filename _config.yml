title: qingchuan-x
description: 记录学习与生活
lang: zh-CN
url: https://qingchuan-x.github.io
since: "2026-09-07T21:46:00+08:00"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
