<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181655'/%3E%3Ctext x='16' y='22' font-family='Inter,sans-serif' font-size='17' font-weight='600' fill='%23a78bfa' text-anchor='middle'%3Eq%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="10.5" r="6.5"/><path d="M12 17v4"/></svg>
        <span>{{ site.title }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/tags/' | relative_url }}">标签</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
      </nav>
      <div class="masthead-tools">
        <button type="button" class="icon-btn" id="cmdk-trigger" title="搜索 (Ctrl+K)" aria-label="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <span class="kbd">Ctrl K</span>
        </button>
        <a class="icon-btn" href="https://github.com/qingchuan-x" target="_blank" rel="noopener" aria-label="GitHub">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="wrapper">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>© {{ site.time | date: "%Y" }} {{ site.title }} · <a href="{{ '/' | relative_url }}">首页</a> · <a href="{{ '/tags/' | relative_url }}">标签</a> · <a href="{{ '/about/' | relative_url }}">关于</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
      <p class="runtime" id="runtime"></p>
    </div>
  </footer>

  <div id="cmdk" class="cmdk" hidden>
    <div class="cmdk-backdrop"></div>
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="搜索文章">
      <input id="cmdk-input" type="text" placeholder="搜索文章标题或标签…" autocomplete="off">
      <ul id="cmdk-list" role="listbox"></ul>
      <div class="cmdk-hint">↑↓ 选择 · Enter 打开 · Esc 关闭</div>
    </div>
  </div>

  <script id="search-data" type="application/json">[{% for post in site.posts %}{"title":{{ post.title | jsonify }},"url":"{{ post.url }}","tags":{{ post.tags | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
      document.querySelectorAll('.year-group, .tag-group').forEach(function (group) {
        if (!group.classList.contains('reveal')) group.classList.add('reveal');
        group.querySelectorAll('.post-list li').forEach(function (li, i) {
          li.classList.add('reveal');
          li.style.transitionDelay = Math.min(i * 40, 280) + 'ms';
        });
      });
      reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
      if ('IntersectionObserver' in window && reveals.length) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
        reveals.forEach(function (el) { io.observe(el); });
      } else {
        reveals.forEach(function (el) { el.classList.add('visible'); });
      }

      var progress = document.getElementById('scroll-progress');
      if (progress) {
        var ticking = false;
        var updateProgress = function () {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          var p = max > 0 ? window.scrollY / max : 0;
          progress.style.transform = 'scaleX(' + Math.min(1, Math.max(0, p)) + ')';
          ticking = false;
        };
        window.addEventListener('scroll', function () {
          if (!ticking) { ticking = true; requestAnimationFrame(updateProgress); }
        }, { passive: true });
        window.addEventListener('resize', updateProgress, { passive: true });
        updateProgress();
      }

      var hero = document.getElementById('hero');
      if (hero && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var canvas = document.getElementById('waves');
        var ctx = canvas.getContext('2d');
        var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
        var width = 0, height = 0, time = 0, raf = 0, running = false, inView = true;
        var pointerX = -1000, pointerY = -1000, targetX = -1000, targetY = -1000;
        var strength = 0, targetStrength = 0, last = 0;
        var accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#a78bfa';
        var draw = function () {
          ctx.clearRect(0, 0, width, height);
          ctx.strokeStyle = accentColor;
          ctx.lineWidth = 0.7;
          var rowsCount = width < 600 ? 25 : 40;
          for (var row = 0; row < rowsCount; row++) {
            var p = row / (rowsCount - 1);
            ctx.globalAlpha = 0.08 + 0.25 * Math.sin(p * Math.PI);
            ctx.beginPath();
            for (var x = -20; x <= width + 20; x += 8) {
              var nx = x / width;
              var edgeFade = Math.sin(Math.max(0, Math.min(1, nx)) * Math.PI);
              var base = height * (0.22 + p * 0.58);
              var wave = Math.sin(nx * 6 + row * 3 + time) * height * 0.09 + Math.cos(nx * 9 - row * 2 - time * 0.7) * height * 0.035;
              var y = base + wave * edgeFade;
              var dx = x - pointerX, dy = y - pointerY;
              var influence = Math.exp(-(dx * dx + dy * dy) / 31250);
              y += Math.tanh(dy / 45) * 48 * influence * strength;
              if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        };
        var resize = function () {
          var box = hero.getBoundingClientRect();
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = box.width;
          height = box.height;
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          draw();
        };
        var animate = function (now) {
          var dt = Math.min((now - (last || now)) / 1000, 0.05);
          last = now;
          time += dt * 0.18;
          var easing = 1 - Math.exp(-dt * 7);
          pointerX += (targetX - pointerX) * easing;
          pointerY += (targetY - pointerY) * easing;
          strength += (targetStrength - strength) * easing;
          draw();
          raf = requestAnimationFrame(animate);
        };
        var startAnim = function () {
          if (!running && inView && !document.hidden) {
            running = true;
            last = 0;
            raf = requestAnimationFrame(animate);
          }
        };
        var stopAnim = function () {
          running = false;
          cancelAnimationFrame(raf);
        };
        hero.addEventListener('pointermove', function (event) {
          if (!finePointer.matches) return;
          var box = hero.getBoundingClientRect();
          targetX = event.clientX - box.left;
          targetY = event.clientY - box.top;
          if (targetStrength === 0) { pointerX = targetX; pointerY = targetY; }
          targetStrength = 1;
        });
        hero.addEventListener('pointerleave', function () {
          targetStrength = 0;
        });
        if ('ResizeObserver' in window) {
          new ResizeObserver(resize).observe(hero);
        } else {
          window.addEventListener('resize', resize, { passive: true });
        }
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries) {
            inView = entries[0].isIntersecting;
            if (inView) startAnim(); else stopAnim();
          }).observe(hero);
        }
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) stopAnim(); else startAnim();
        });
        resize();
        startAnim();
      }

      var filterBar = document.getElementById('tag-filter');
      if (filterBar) {
        var chips = Array.prototype.slice.call(filterBar.querySelectorAll('.chip'));
        var rows = Array.prototype.slice.call(document.querySelectorAll('.post-list li[data-tags]'));
        var groups = Array.prototype.slice.call(document.querySelectorAll('.year-group'));
        var applyFilter = function (tag) {
          rows.forEach(function (row) {
            var tags = (row.getAttribute('data-tags') || '').split(',');
            row.hidden = tag !== '' && tags.indexOf(tag) === -1;
          });
          groups.forEach(function (group) {
            var visible = group.querySelectorAll('.post-list li[data-tags]:not([hidden])');
            group.hidden = visible.length === 0;
          });
        };
        chips.forEach(function (chip) {
          chip.addEventListener('click', function () {
            chips.forEach(function (c) {
              c.classList.toggle('active', c === chip);
              c.setAttribute('aria-pressed', c === chip ? 'true' : 'false');
            });
            applyFilter(chip.getAttribute('data-tag'));
          });
        });
      }

      var runtime = document.getElementById('runtime');
      if (runtime) {
        var since = new Date('{{ site.since | default: "2026-09-07T00:00:00+08:00" }}');
        var tick = function () {
          var total = Math.floor(Math.max(0, Date.now() - since.getTime()) / 1000);
          var d = Math.floor(total / 86400);
          var h = Math.floor(total % 86400 / 3600);
          var m = Math.floor(total % 3600 / 60);
          var s = total % 60;
          runtime.textContent = '本站已安全运行 ' + d + ' 天 ' + h + ' 时 ' + m + ' 分 ' + s + ' 秒';
        };
        tick();
        setInterval(tick, 1000);
      }

      document.querySelectorAll('.post-content h2[id], .post-content h3[id]').forEach(function (h) {
        if (h.querySelector('.heading-anchor')) return;
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.className = 'heading-anchor';
        a.textContent = '#';
        a.setAttribute('aria-label', '链接到 ' + h.textContent);
        h.appendChild(a);
      });

      var cmdk = document.getElementById('cmdk');
      var trigger = document.getElementById('cmdk-trigger');
      if (cmdk && trigger) {
        var input = document.getElementById('cmdk-input');
        var list = document.getElementById('cmdk-list');
        var data = [];
        var dataEl = document.getElementById('search-data');
        if (dataEl) {
          try { data = JSON.parse(dataEl.textContent); } catch (e) { data = []; }
        }
        var items = [], active = 0;
        var setActive = function (i) {
          active = i;
          Array.prototype.forEach.call(list.children, function (li, j) {
            li.classList.toggle('active', j === i);
          });
        };
        var go = function (i) {
          if (items[i]) location.href = items[i].url;
        };
        var render = function (q) {
          q = (q || '').toLowerCase();
          items = data.filter(function (p) {
            return !q || p.title.toLowerCase().indexOf(q) > -1 || p.tags.join(' ').toLowerCase().indexOf(q) > -1;
          });
          active = 0;
          list.innerHTML = '';
          if (!items.length) {
            var empty = document.createElement('li');
            empty.className = 'empty';
            empty.textContent = '没有匹配的文章';
            list.appendChild(empty);
            return;
          }
          items.forEach(function (p, i) {
            var li = document.createElement('li');
            if (i === active) li.classList.add('active');
            var title = document.createElement('span');
            title.textContent = p.title;
            var tags = document.createElement('span');
            tags.className = 'tags';
            tags.textContent = p.tags.join(' / ');
            li.appendChild(title);
            li.appendChild(tags);
            li.addEventListener('mouseenter', function () { setActive(i); });
            li.addEventListener('click', function () { go(i); });
            list.appendChild(li);
          });
        };
        var openCmdk = function () {
          cmdk.hidden = false;
          input.value = '';
          render('');
          input.focus();
        };
        var closeCmdk = function () {
          cmdk.hidden = true;
        };
        trigger.addEventListener('click', openCmdk);
        cmdk.querySelector('.cmdk-backdrop').addEventListener('click', closeCmdk);
        input.addEventListener('input', function () { render(input.value); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(active + 1, items.length - 1)); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
          else if (e.key === 'Enter') { go(active); }
          else if (e.key === 'Escape') { closeCmdk(); }
        });
        document.addEventListener('keydown', function (e) {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            if (cmdk.hidden) openCmdk(); else closeCmdk();
          }
        });
      }

      document.querySelectorAll('.post-content pre').forEach(function (pre) {
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.setAttribute('aria-label', '复制代码');
        btn.textContent = '复制';
        btn.addEventListener('click', function () {
          var code = pre.querySelector('code');
          if (!code) return;
          navigator.clipboard.writeText(code.innerText).then(function () {
            btn.textContent = '已复制';
            setTimeout(function () { btn.textContent = '复制'; }, 1500);
          });
        });
        pre.appendChild(btn);
      });
    });
  </script>
</body>
</html>
